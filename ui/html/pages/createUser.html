{{define "main"}}
<div class="container bg-primary py-4">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6 text-center mb-4 mb-md-0">
                <img src="/static/img/3456388.png" class="img-fluid rounded" style="max-width: 80%;">
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <h3 class="mb-4">Create profile</h3>
                    <form action="/create/user" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" id="name" name="name" class="form-control" placeholder="">
                        </div>
                        <div class="row">
                            <div class="col-4">
                                <label for="age" class="form-label">Age</label>
                                <input type="number" id="age" name="age" class="form-control" placeholder="">
                            </div>
                            <div class="col-4">
                                <label for="weight" class="form-label">Weight</label>
                                <input type="number" id="weight" name="weight" class="form-control" placeholder="kg">
                            </div>
                            <div class="col-4">
                                <label for="height" class="form-label">Height</label>
                                <input type="number" id="height" name="height" class="form-control" placeholder="cm">
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-12">
                                <label class="form-label d-block">Activity level</label>
                                <div class="btn-group w-100" role="group" aria-label="Activity level">

                                    <input type="radio" class="btn-check" name="activity" id="activity-1" value="1" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="activity-1">Sedentary</label>

                                    <input type="radio" class="btn-check" name="activity" id="activity-2" value="2" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="activity-2">Light</label>

                                    <input type="radio" class="btn-check" name="activity" id="activity-3" value="3" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="activity-3">Moderate</label>

                                    <input type="radio" class="btn-check" name="activity" id="activity-4" value="4" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="activity-4">Active</label>

                                    <input type="radio" class="btn-check" name="activity" id="activity-5" value="5" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="activity-5">Very active</label>

                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-4">Save</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
